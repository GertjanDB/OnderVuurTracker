<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tracker Pro - Precision Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --tracker-color: #ef4444; /* Default Red */
            --bg-color: #09090b;
            --panel-bg: #18181b;
            --text-color: #ffffff;
            --border-color: #27272a;
            --dot-size: 24px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            touch-action: none;
        }

        /* Viewport & Map */
        #viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #111113;
            z-index: 10;
        }

        #map-wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            backface-visibility: hidden;
        }

        #map-img {
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transition: filter 0.5s;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 2;
        }

        /* Tracker Dot */
        .tracker-base {
            background: var(--tracker-color);
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--tracker-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }
        #tracker-dot {
            position: absolute;
            transform-origin: center;
            transform: translate(-50%, -50%);
            width: var(--dot-size);
            height: var(--dot-size);
            z-index: 10;
            display: none;
        }
        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--tracker-color);
            border-radius: 50%;
            opacity: 0.5;
            z-index: 1;
            animation: pulse-animation 2s infinite ease-out;
        }
        @keyframes pulse-animation {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        /* Dest Marker: Druppel Vorm */
        #dest-marker {
            position: absolute;
            transform: translate(-50%, -100%);
            z-index: 5;
            display: none;
            pointer-events: none;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }
        .teardrop {
            width: 44px;
            height: 44px;
            background-color: var(--tracker-color);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
        }
        .teardrop-inner {
            transform: rotate(45deg);
            width: 34px;
            height: 34px;
            background: #18181b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid white;
            font-size: 16px;
        }
        .teardrop-inner img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Forms */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--text-color); margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; }
        
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div id="main-header" class="p-4 bg-zinc-950 flex justify-between items-center border-b border-zinc-800 z-[200] relative pt-[env(safe-area-inset-top, 16px)]">
        <div class="flex-grow">
            <h1 class="text-lg font-black italic tracking-tighter text-zinc-400 uppercase flex items-center gap-2">
                <span id="live-dot" class="w-2 h-2 bg-red-500 rounded-full animate-pulse hidden"></span>
                TRACKER<span id="title-accent" class="text-blue-500 underline">PRO</span>
            </h1>
            <p id="status-text" class="text-[10px] text-zinc-500 font-mono uppercase tracking-widest leading-none">Systeem gereed</p>
        </div>
        <button id="btn-settings" onclick="resetToConfig()" class="p-3 bg-zinc-900 rounded-xl border border-zinc-800 text-zinc-400 hidden active:bg-zinc-800 transition-colors">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
            </svg>
        </button>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-content" class="flex-grow flex flex-col overflow-hidden">
        
        <!-- TOP: Map Container -->
        <div id="preview-area" class="flex-grow relative bg-black overflow-hidden transition-all duration-500 min-h-0">
            
            <!-- Zoom Controls Inside Frame -->
            <div id="zoom-ctrls" class="absolute top-4 right-4 z-[100] flex flex-col gap-2">
                <button onclick="changeZoom(0.3)" class="w-10 h-10 bg-zinc-900/80 backdrop-blur text-white rounded-full font-black text-xl border border-zinc-700 shadow-lg active:scale-95 transition-transform flex items-center justify-center">+</button>
                <button onclick="changeZoom(-0.3)" class="w-10 h-10 bg-zinc-900/80 backdrop-blur text-white rounded-full font-black text-xl border border-zinc-700 shadow-lg active:scale-95 transition-transform flex items-center justify-center">-</button>
            </div>

            <!-- Viewport -->
            <div id="viewport">
                <div id="map-wrapper">
                    <img id="map-img" alt="Kaart">
                    <canvas id="route-canvas"></canvas>
                    
                    <div id="dest-marker">
                        <div class="teardrop"><div class="teardrop-inner" id="dest-icon-container"></div></div>
                    </div>
                    
                    <div id="tracker-dot">
                        <div class="tracker-base"><div class="pulse"></div></div>
                    </div>
                </div>
            </div>

            <!-- Live Prop Overlay -->
            <div id="prop-overlay-bottom" class="absolute bottom-0 left-0 right-0 p-4 z-[90] hidden pointer-events-none bg-gradient-to-t from-black/90 to-transparent pt-12 pb-[env(safe-area-inset-bottom,24px)]">
                <div class="bg-black/60 backdrop-blur-md border border-white/10 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full border-2 border-current text-[var(--tracker-color)] flex items-center justify-center bg-zinc-900">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                        </div>
                        <div>
                            <p class="text-[12px] text-white font-black uppercase tracking-widest leading-tight">Tracking Actief</p>
                            <p class="text-[10px] text-zinc-400 font-mono mt-0.5">Bijgewerkt: zojuist</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-green-500 font-bold uppercase animate-pulse tracking-widest">Uplink</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- BOTTOM: Config Panel -->
        <div id="config-container" class="flex-none bg-[var(--panel-bg)] border-t border-zinc-800 overflow-y-auto max-h-[50vh] p-4 space-y-4">
            
            <!-- Upload Kaart Knop -->
            <button onclick="document.getElementById('map-upload').click()" class="w-full py-3 bg-zinc-800 text-white rounded-xl font-black uppercase tracking-widest text-[10px] border border-zinc-700 active:bg-zinc-700 transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Kaart Uploaden / Wijzigen
            </button>

            <!-- 1. App Modus & Identiteit -->
            <div class="grid grid-cols-2 gap-3">
                <div class="relative">
                    <select id="app-mode" onchange="updateMode()" class="w-full bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-3 pr-8 rounded-xl outline-none">
                        <option value="watcher">👁️ Iemand Volgen</option>
                        <option value="shield">🛡️ Mijn Locatie (Shield)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
                <div class="relative">
                    <select id="person-select" onchange="updatePerson()" class="w-full bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-3 pr-8 rounded-xl outline-none">
                        <option value="maaike">🔴 Maaike (Rood)</option>
                        <option value="orlando">🔵 Orlando (Blauw)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- 2. Tools -->
            <div class="flex gap-2">
                <div class="relative flex-grow">
                    <select id="tool-select" onchange="setTool(this.value)" class="w-full bg-zinc-900 border border-zinc-800 text-white text-[11px] font-bold p-3 pr-8 rounded-xl outline-none">
                        <option value="pan">🖐️ Kaart Verslepen</option>
                        <option value="point">📍 Plaats Vast Punt (Centreren)</option>
                        <option id="opt-route" value="route">🗺️ Teken Volgroute</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
                <button onclick="clearMap()" class="px-5 bg-zinc-900 border border-zinc-800 text-red-500 rounded-xl text-[10px] font-black uppercase tracking-widest active:bg-zinc-800 transition-colors">
                    Wis
                </button>
            </div>

            <!-- 3. Eindpunt -->
            <div id="dest-config" class="grid grid-cols-3 gap-2">
                <button id="btn-dest-none" onclick="setDest('none')" class="py-2 bg-zinc-800 border-2 border-white rounded-lg text-[9px] font-bold text-white uppercase">Geen Icoon</button>
                <button id="btn-dest-home" onclick="setDest('home')" class="py-2 bg-zinc-900 border-2 border-transparent rounded-lg text-[9px] font-bold text-zinc-400 uppercase">🏠 Home</button>
                <button onclick="document.getElementById('dest-upload').click()" class="py-2 bg-zinc-900 border-2 border-transparent rounded-lg text-[9px] font-bold text-zinc-400 uppercase">📸 Foto</button>
            </div>

            <!-- 4. Sliders -->
            <div class="bg-zinc-900/50 p-4 rounded-xl border border-zinc-800 space-y-4">
                <div class="space-y-1">
                    <div class="flex justify-between text-[9px] text-zinc-400 uppercase font-black">
                        <span>Grootte Signaal</span>
                    </div>
                    <input type="range" id="size-slider" min="10" max="60" value="24" oninput="updateSize(this.value)">
                </div>
                <div class="space-y-1" id="speed-config">
                    <div class="flex justify-between text-[9px] text-zinc-400 uppercase font-black">
                        <span>Snelheid Route</span>
                    </div>
                    <input type="range" id="speed-slider" min="10" max="200" value="50" oninput="STATE.speed = parseInt(this.value)">
                </div>
            </div>

            <div class="flex items-center justify-between px-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="auto-center-toggle" onchange="STATE.autoCenter = this.checked" class="w-4 h-4 accent-blue-600 rounded">
                    <span class="text-[10px] text-zinc-400 uppercase font-black">Auto-Center (Tijdens Live)</span>
                </label>
            </div>

            <!-- 5. Actie Knoppen -->
            <div class="pt-1">
                <button id="btn-live" onclick="startLiveMode()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-blue-900/30 disabled:opacity-50 transition-all active:scale-95" disabled>Start Live App</button>
            </div>
        </div>
    </div>

    <!-- Startscherm Overlay (Zolang er geen kaart is) -->
    <div id="intro-screen" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-[300] bg-zinc-950">
        <div class="w-20 h-20 bg-blue-500/10 border border-blue-500/20 rounded-full flex items-center justify-center mb-6 animate-pulse">
            <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A2 2 0 013 15.382V5.618a2 2 0 011.447-1.817l7-2a2 2 0 011.106 0l7 2A2 2 0 0121 5.618v9.764a2 2 0 01-1.553 1.898L15 20V13H9v7z"></path></svg>
        </div>
        <button onclick="document.getElementById('map-upload').click()" class="bg-blue-600 hover:bg-blue-500 px-10 py-4 rounded-xl font-bold shadow-xl shadow-blue-900/40 transition-all text-white">
            KAART LADEN
        </button>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="map-upload" class="hidden" accept="image/*" onchange="handleMapUpload(event)">
    <input type="file" id="dest-upload" class="hidden" accept="image/*" onchange="handleDestUpload(event)">

    <script>
        const STATE = {
            mode: 'watcher',
            tool: 'pan',
            person: 'maaike',
            destType: 'none',
            destImg: null,
            points: [],
            scale: 1,
            posX: 0,
            posY: 0,
            size: 24,
            speed: 50,
            autoCenter: false, 
            isLive: false,
            animProgress: 0,
            targetIndex: 1,
            lastTime: 0,
            animId: null
        };

        const COLORS = { maaike: '#ef4444', orlando: '#3b82f6' };
        let isDragging = false;
        let startX, startY;

        const viewport = document.getElementById('viewport');
        const mapWrapper = document.getElementById('map-wrapper');
        const mapImg = document.getElementById('map-img');
        const canvas = document.getElementById('route-canvas');
        const ctx = canvas.getContext('2d');
        
        const trackerDot = document.getElementById('tracker-dot');
        const destMarker = document.getElementById('dest-marker');
        const destIconContainer = document.getElementById('dest-icon-container');
        
        const configContainer = document.getElementById('config-container');
        const btnLive = document.getElementById('btn-live');
        const btnSettings = document.getElementById('btn-settings');
        const mainHeader = document.getElementById('main-header');

        // --- UPLOAD LOGICA ---
        function handleMapUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                mapImg.onload = () => {
                    document.getElementById('intro-screen').classList.add('hidden');
                    
                    // Wacht robuust tot de browser de UI heeft opgebouwd
                    function setupMap() {
                        const rect = viewport.getBoundingClientRect();
                        // Als breedte 0 is, probeer het de volgende frame opnieuw
                        if(rect.width === 0 || rect.height === 0) {
                            requestAnimationFrame(setupMap);
                            return;
                        }
                        
                        canvas.width = mapImg.naturalWidth;
                        canvas.height = mapImg.naturalHeight;
                        
                        // Afbeelding neemt exact de hoogte van de rechthoek (viewport) over
                        const scaleH = rect.height / mapImg.naturalHeight;
                        STATE.scale = scaleH;
                        
                        STATE.posX = (rect.width - (mapImg.naturalWidth * STATE.scale)) / 2;
                        STATE.posY = (rect.height - (mapImg.naturalHeight * STATE.scale)) / 2;
                        STATE.points = []; 
                        
                        applyTransform();
                        updateThemeColors();
                        drawMap();
                        checkReadyState();
                    }
                    
                    setupMap();
                };
                mapImg.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleDestUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                STATE.destImg = e.target.result;
                setDest('img');
            };
            reader.readAsDataURL(file);
        }

        // --- MAP INTERACTIES ---
        viewport.addEventListener('mousedown', (e) => startInteraction(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => moveInteraction(e.clientX, e.clientY));
        window.addEventListener('mouseup', endInteraction);
        viewport.addEventListener('mouseleave', endInteraction);
        
        viewport.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            startInteraction(t.clientX, t.clientY);
        }, {passive: false});
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            moveInteraction(t.clientX, t.clientY);
        }, {passive: false});
        window.addEventListener('touchend', endInteraction);

        function startInteraction(x, y) {
            if (STATE.isLive) return;
            
            if (STATE.tool === 'pan') {
                isDragging = true;
                startX = x - STATE.posX;
                startY = y - STATE.posY;
                viewport.style.cursor = 'grabbing';
            } else {
                const mapCoords = getMapCoords(x, y);
                if (STATE.tool === 'point') {
                    STATE.points = [mapCoords];
                    
                    // ONMIDDELLIJK CENTREREN BIJ VAST PUNT
                    const rect = viewport.getBoundingClientRect();
                    STATE.posX = (rect.width / 2) - (mapCoords.x * STATE.scale);
                    STATE.posY = (rect.height / 2) - (mapCoords.y * STATE.scale);
                    applyTransform();
                    
                } else if (STATE.tool === 'route') {
                    STATE.points.push(mapCoords);
                }
                drawMap();
                checkReadyState();
            }
        }

        function moveInteraction(x, y) {
            if (!isDragging || STATE.tool !== 'pan') return;
            STATE.posX = x - startX;
            STATE.posY = y - startY;
            applyTransform();
        }

        function endInteraction() { 
            isDragging = false; 
            if(STATE.tool === 'pan') viewport.style.cursor = 'grab';
        }

        function getMapCoords(clientX, clientY) {
            const rect = mapWrapper.getBoundingClientRect();
            return {
                x: (clientX - rect.left) / STATE.scale,
                y: (clientY - rect.top) / STATE.scale
            };
        }

        function applyTransform() {
            mapWrapper.style.transform = `translate3d(${STATE.posX}px, ${STATE.posY}px, 0) scale(${STATE.scale})`;
        }

        function changeZoom(delta) {
            const oldScale = STATE.scale;
            STATE.scale = Math.max(0.01, Math.min(10, STATE.scale + delta));
            const ratio = STATE.scale / oldScale;

            const rect = viewport.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            STATE.posX = centerX - (centerX - STATE.posX) * ratio;
            STATE.posY = centerY - (centerY - STATE.posY) * ratio;

            applyTransform();
            drawMap();
        }

        // --- UI UPDATES ---
        function setTool(tool) {
            if (STATE.isLive) return;
            STATE.tool = tool;
            document.getElementById('tool-select').value = tool; // sync UI
            viewport.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
        }

        function updateMode() {
            const isShield = document.getElementById('app-mode').value === 'shield';
            STATE.mode = document.getElementById('app-mode').value;
            
            document.getElementById('dest-config').style.display = isShield ? 'none' : 'grid';
            document.getElementById('speed-config').style.display = isShield ? 'none' : 'block';
            
            const optRoute = document.getElementById('opt-route');
            if (isShield) {
                optRoute.style.display = 'none';
                if(STATE.tool === 'route') {
                    setTool('point');
                }
            } else {
                optRoute.style.display = 'block';
            }
            
            updateThemeColors();
            drawMap();
        }

        function updatePerson() {
            STATE.person = document.getElementById('person-select').value;
            updateThemeColors();
            drawMap();
        }

        function updateThemeColors() {
            const color = COLORS[STATE.person];
            document.documentElement.style.setProperty('--tracker-color', color);
            document.getElementById('title-accent').style.color = color;
            btnLive.style.backgroundColor = color;
        }

        function updateSize(val) {
            STATE.size = val;
            document.documentElement.style.setProperty('--dot-size', `${val}px`);
        }

        function setDest(type) {
            STATE.destType = type;
            ['none', 'home'].forEach(t => {
                const btn = document.getElementById(`btn-dest-${t}`);
                if(btn) {
                    btn.classList.toggle('border-white', t === type);
                    btn.classList.toggle('text-white', t === type);
                    btn.classList.toggle('border-transparent', t !== type);
                }
            });
            drawMap();
        }

        function clearMap() { STATE.points = []; drawMap(); checkReadyState(); }

        function checkReadyState() {
            const ok = STATE.points.length > 0;
            btnLive.disabled = !ok;
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (STATE.points.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = COLORS[STATE.person];
                ctx.lineWidth = 6 / STATE.scale;
                if(STATE.points.length > 1) ctx.setLineDash([15/STATE.scale, 10/STATE.scale]);
                ctx.moveTo(STATE.points[0].x, STATE.points[0].y);
                STATE.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();

                const last = STATE.points[STATE.points.length - 1];
                trackerDot.style.display = 'block';
                trackerDot.style.left = last.x + 'px';
                trackerDot.style.top = last.y + 'px';
            } else {
                trackerDot.style.display = 'none';
            }

            if (STATE.mode !== 'shield' && STATE.destType !== 'none' && STATE.points.length > 0) {
                destMarker.style.display = 'block';
                const last = STATE.points[STATE.points.length - 1];
                destMarker.style.left = last.x + 'px';
                destMarker.style.top = last.y + 'px';
                if (STATE.destType === 'home') destIconContainer.innerHTML = '🏠';
                else if (STATE.destImg) destIconContainer.innerHTML = `<img src="${STATE.destImg}">`;
            } else { 
                destMarker.style.display = 'none'; 
            }
        }

        // --- LIVE LOGICA ---
        function startLiveMode() {
            STATE.isLive = true;
            stopAnimation(); 
            
            mainHeader.style.display = 'none';
            configContainer.style.display = 'none';
            btnSettings.classList.remove('hidden'); 
            
            document.getElementById('prop-overlay-bottom').classList.remove('hidden');
            document.getElementById('zoom-ctrls').style.display = 'none';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            mapImg.style.filter = STATE.mode === 'shield' ? 'grayscale(0.4) contrast(1.2)' : 'saturate(1.2)';
            
            startAnimation();
        }

        function resetToConfig() {
            STATE.isLive = false;
            stopAnimation();
            
            mainHeader.style.display = 'flex';
            configContainer.style.display = 'block';
            btnSettings.classList.add('hidden'); 
            
            document.getElementById('prop-overlay-bottom').classList.add('hidden');
            document.getElementById('zoom-ctrls').style.display = 'flex';
            document.getElementById('status-text').innerText = "Systeem gereed";
            
            mapImg.style.filter = 'none';
            drawMap(); 
        }

        function startAnimation() {
            STATE.animProgress = 0;
            STATE.targetIndex = 1;
            STATE.lastTime = performance.now();
            
            if(STATE.mode === 'shield' || STATE.points.length < 2) {
                const p = STATE.points[0];
                updateTrackerLive(p.x, p.y);
                setTimeout(() => { if(STATE.isLive) updateTrackerLive(p.x, p.y); }, 500);
            } else {
                STATE.animId = requestAnimationFrame(animLoop);
            }
        }

        function stopAnimation() {
            if (STATE.animId) cancelAnimationFrame(STATE.animId);
            drawMap(); 
        }

        function animLoop(timestamp) {
            if (!STATE.isLive) return;
            const delta = (timestamp - STATE.lastTime) / 1000;
            STATE.lastTime = timestamp;
            
            const p1 = STATE.points[STATE.targetIndex - 1];
            const p2 = STATE.points[STATE.targetIndex];
            const dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            
            if (dist > 0) STATE.animProgress += (STATE.speed * delta) / dist;
            else STATE.animProgress = 1;
            
            if (STATE.animProgress >= 1) {
                STATE.animProgress = 0;
                STATE.targetIndex++;
                if (STATE.targetIndex >= STATE.points.length) STATE.targetIndex = 1; 
            }
            
            const curX = p1.x + (p2.x - p1.x) * STATE.animProgress;
            const curY = p1.y + (p2.y - p1.y) * STATE.animProgress;
            
            updateTrackerLive(curX, curY);
            STATE.animId = requestAnimationFrame(animLoop);
        }

        function updateTrackerLive(x, y) {
            trackerDot.style.left = `${x}px`;
            trackerDot.style.top = `${y}px`;
            
            // Auto-Center Logica tijdens loop
            if (STATE.autoCenter && STATE.isLive) {
                const rect = viewport.getBoundingClientRect();
                STATE.posX = (rect.width / 2) - (x * STATE.scale);
                STATE.posY = (rect.height / 2) - (y * STATE.scale);
                applyTransform();
            }
        }

        // --- RESIZE OBSERVER ---
        let lastViewportW = 0;
        let lastViewportH = 0;

        const resizeObs = new ResizeObserver(entries => {
            for(let entry of entries) {
                const nw = entry.contentRect.width;
                const nh = entry.contentRect.height;

                if (lastViewportW > 0 && lastViewportH > 0 && nw > 0 && nh > 0) {
                    const isMovingRoute = STATE.autoCenter && STATE.isLive && STATE.points.length > 1;
                    
                    if (!isMovingRoute) {
                        const cx = (lastViewportW / 2 - STATE.posX) / STATE.scale;
                        const cy = (lastViewportH / 2 - STATE.posY) / STATE.scale;
                        STATE.posX = (nw / 2) - (cx * STATE.scale);
                        STATE.posY = (nh / 2) - (cy * STATE.scale);
                        applyTransform();
                    }
                }
                lastViewportW = nw;
                lastViewportH = nh;
            }
        });
        resizeObs.observe(viewport);

    </script>
</body>
