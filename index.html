<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SafeTrace Pro - S22 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --tracker-color: #ef4444;
            --bg-color: #09090b;
            --panel-bg: #18181b;
            --text-color: #ffffff;
            --border-color: #27272a;
            --dot-size: 24px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            touch-action: none;
        }

        /* --- S22 PREVIEW FRAME (19.5:9 Ratio) --- */
        #phone-mockup {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .mockup-mode {
            width: 360px; /* S22 Breedte */
            height: 780px; /* S22 Hoogte */
            border: 10px solid #27272a;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .live-mode {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            border: 0 solid transparent;
            border-radius: 0;
        }

        #viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000;
            z-index: 10;
            border-radius: inherit;
        }

        #map-wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #map-img {
            display: block;
            pointer-events: none;
            user-select: none;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 2;
        }

        #tracker-dot {
            position: absolute;
            transform-origin: center;
            transform: translate(-50%, -50%);
            width: var(--dot-size);
            height: var(--dot-size);
            z-index: 10;
            display: none;
            color: var(--tracker-color);
        }
        .tracker-core {
            width: 100%; height: 100%;
            background-color: currentColor;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 15px currentColor;
        }

        #dest-marker {
            position: absolute;
            transform: translate(-50%, -100%);
            z-index: 5;
            display: none;
        }
        .teardrop {
            width: 44px; height: 44px;
            background-color: var(--tracker-color);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
        }
        .teardrop-inner {
            transform: rotate(45deg);
            width: 34px; height: 34px;
            background: #18181b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 2px solid white;
        }

        .config-hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: var(--text-color); margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 5px; background: var(--border-color); border-radius: 2px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div id="main-header" class="p-4 bg-zinc-950 flex justify-between items-center border-b border-zinc-800 z-[200] relative pt-[env(safe-area-inset-top, 16px)]">
        <div class="flex-grow">
            <h1 class="text-lg font-black italic tracking-tighter text-zinc-400 uppercase flex items-center gap-2">
                <span id="live-dot" class="w-2 h-2 bg-red-500 rounded-full animate-pulse hidden"></span>
                SafeTrace <span id="title-accent" class="text-blue-500">PRO</span>
            </h1>
        </div>
        <!-- Setting Button (Gear only) -->
        <button id="btn-settings" onclick="resetToConfig()" class="p-2 bg-zinc-900 rounded-xl border border-zinc-800 text-zinc-400 hidden active:bg-zinc-800">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
        </button>
    </div>

    <div id="intro-screen" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-[300] bg-[var(--bg-color)]">
        <h2 class="text-2xl font-black uppercase mb-8 text-zinc-600">S22 Configuratie</h2>
        <button onclick="document.getElementById('map-upload').click()" class="bg-blue-600 px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-white shadow-xl">
            Upload Kaart
        </button>
    </div>

    <div id="app-content" class="flex-grow flex flex-col hidden overflow-hidden">
        
        <!-- Preview Area -->
        <div id="preview-area" class="flex-grow flex items-center justify-center bg-zinc-950 transition-all duration-500 relative overflow-hidden">
            <div id="phone-mockup" class="mockup-mode bg-black overflow-hidden flex flex-col">
                
                <!-- Zoom Controls -->
                <div class="absolute top-4 right-4 z-[100] flex flex-col gap-2">
                    <button onclick="changeZoom(0.3)" class="w-10 h-10 bg-zinc-900/80 text-white rounded-full font-black border border-zinc-700">+</button>
                    <button onclick="changeZoom(-0.3)" class="w-10 h-10 bg-zinc-900/80 text-white rounded-full font-black border border-zinc-700">-</button>
                </div>

                <div id="viewport">
                    <div id="map-wrapper">
                        <img id="map-img" alt="Kaart">
                        <canvas id="route-canvas"></canvas>
                        <div id="dest-marker"><div class="teardrop"><div class="teardrop-inner" id="dest-icon-container"></div></div></div>
                        <div id="tracker-dot"><div class="tracker-core"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Config Panel -->
        <div id="config-container" class="flex-none bg-[var(--panel-bg)] border-t border-zinc-800 rounded-t-[2.5rem] overflow-y-auto max-h-[45vh] p-6 space-y-4">
            
            <div class="flex gap-2">
                <button onclick="toggleFullscreen()" class="flex-grow py-3 bg-zinc-900 text-zinc-400 rounded-xl text-[10px] font-black uppercase border border-zinc-800">
                    ⛶ Fullscreen Browser
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <select id="app-mode" onchange="updateMode()" class="bg-zinc-900 text-white text-[11px] font-bold p-3 rounded-xl outline-none">
                    <option value="watcher">👁️ Volgen</option>
                    <option value="shield">🛡️ Shield</option>
                </select>
                <select id="person-select" onchange="updatePerson()" class="bg-zinc-900 text-white text-[11px] font-bold p-3 rounded-xl outline-none">
                    <option value="maaike">🔴 Maaike</option>
                    <option value="orlando">🔵 Orlando</option>
                </select>
            </div>

            <div class="flex gap-2">
                <select id="tool-select" onchange="setTool(this.value)" class="flex-grow bg-zinc-900 text-white text-[11px] font-bold p-3 rounded-xl outline-none">
                    <option value="pan">🖐️ Verplaats</option>
                    <option value="point">📍 Punt</option>
                    <option id="opt-route" value="route">🗺️ Route</option>
                </select>
                <button onclick="clearMap()" class="px-5 bg-zinc-900 text-red-500 rounded-xl text-[10px] font-black uppercase">Wis</button>
            </div>

            <div class="space-y-2 bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <input type="range" id="size-slider" min="10" max="60" value="24" class="w-full" oninput="updateSize(this.value)">
                <div class="flex items-center justify-between">
                    <span class="text-[9px] text-zinc-400 uppercase font-black">Auto-Center</span>
                    <input type="checkbox" id="auto-center-toggle" onchange="STATE.autoCenter = this.checked" class="w-4 h-4 accent-blue-600">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="btn-preview" onclick="togglePreview()" class="py-3.5 bg-zinc-800 text-white rounded-xl font-black uppercase text-[10px]" disabled>Preview</button>
                <button id="btn-live" onclick="startLiveMode()" class="py-3.5 bg-blue-600 text-white rounded-xl font-black uppercase text-[10px]" disabled>Start Live</button>
            </div>
        </div>
    </div>

    <input type="file" id="map-upload" class="hidden" accept="image/*" onchange="handleMapUpload(event)">

    <script>
        const STATE = {
            points: [], scale: 1, posX: 0, posY: 0, 
            size: 24, speed: 50, autoCenter: false,
            isPlayingPreview: false, isLive: false,
            person: 'maaike', tool: 'pan', mode: 'watcher'
        };

        const COLORS = { maaike: '#ef4444', orlando: '#3b82f6' };
        const viewport = document.getElementById('viewport');
        const mapWrapper = document.getElementById('map-wrapper');
        const mapImg = document.getElementById('map-img');
        const canvas = document.getElementById('route-canvas');
        const ctx = canvas.getContext('2d');
        const phoneMockup = document.getElementById('phone-mockup');

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function handleMapUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                mapImg.src = e.target.result;
                mapImg.onload = () => {
                    document.getElementById('intro-screen').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');
                    canvas.width = mapImg.naturalWidth;
                    canvas.height = mapImg.naturalHeight;
                    
                    const mockupRect = phoneMockup.getBoundingClientRect();
                    
                    // 1. Schermvullend laden op breedte
                    STATE.scale = mockupRect.width / mapImg.naturalWidth;
                    
                    // 2. Nulpunt exact in het midden van het scherm plaatsen
                    STATE.posX = (mockupRect.width / 2) - (mapImg.naturalWidth * STATE.scale / 2);
                    STATE.posY = (mockupRect.height / 2) - (mapImg.naturalHeight * STATE.scale / 2);
                    
                    applyTransform();
                    drawMap();
                    checkReadyState();
                }
            };
            reader.readAsDataURL(file);
        }

        function applyTransform() {
            mapWrapper.style.transform = `translate3d(${STATE.posX}px, ${STATE.posY}px, 0) scale(${STATE.scale})`;
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (STATE.points.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = COLORS[STATE.person];
                
                // BOLDIKTE VERANDERT NIET MEE (delen door schaal)
                ctx.lineWidth = 6 / STATE.scale; 
                
                ctx.setLineDash(STATE.points.length > 1 ? [15/STATE.scale, 10/STATE.scale] : []);
                ctx.moveTo(STATE.points[0].x, STATE.points[0].y);
                STATE.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();

                const last = STATE.points[STATE.points.length - 1];
                const dot = document.getElementById('tracker-dot');
                dot.style.display = 'block';
                dot.style.left = last.x + 'px';
                dot.style.top = last.y + 'px';
            }
        }

        function changeZoom(delta) {
            const oldScale = STATE.scale;
            STATE.scale = Math.max(0.1, Math.min(10, STATE.scale + delta));
            const ratio = STATE.scale / oldScale;
            const rect = viewport.getBoundingClientRect();
            STATE.posX = (rect.width/2) - ((rect.width/2) - STATE.posX) * ratio;
            STATE.posY = (rect.height/2) - ((rect.height/2) - STATE.posY) * ratio;
            applyTransform();
            drawMap();
        }

        function setTool(t) { STATE.tool = t; viewport.style.cursor = t === 'pan' ? 'grab' : 'crosshair'; }
        function updateSize(v) { STATE.size = v; document.documentElement.style.setProperty('--dot-size', `${v}px`); }
        function checkReadyState() {
            const ok = STATE.points.length > 0;
            document.getElementById('btn-preview').disabled = !ok;
            document.getElementById('btn-live').disabled = !ok;
        }

        // --- Interaction ---
        let isDragging = false, startX, startY;
        viewport.addEventListener('pointerdown', (e) => {
            if (STATE.tool === 'pan') {
                isDragging = true;
                startX = e.clientX - STATE.posX; startY = e.clientY - STATE.posY;
            } else {
                const rect = mapWrapper.getBoundingClientRect();
                const p = { x: (e.clientX - rect.left) / STATE.scale, y: (e.clientY - rect.top) / STATE.scale };
                if (STATE.tool === 'point') STATE.points = [p];
                else STATE.points.push(p);
                drawMap(); checkReadyState();
            }
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            STATE.posX = e.clientX - startX; STATE.posY = e.clientY - startY;
            applyTransform();
        });
        window.addEventListener('pointerup', () => isDragging = false);

        function resetToConfig() {
            STATE.isLive = false;
            document.getElementById('config-container').classList.remove('config-hidden');
            document.getElementById('btn-settings').classList.add('hidden');
            phoneMockup.className = 'mockup-mode bg-black overflow-hidden flex flex-col';
            drawMap();
        }

        function togglePreview() {
            document.getElementById('config-container').classList.add('config-hidden');
            document.getElementById('btn-settings').classList.remove('hidden');
        }

        function startLiveMode() {
            STATE.isLive = true;
            document.getElementById('config-container').classList.add('config-hidden');
            document.getElementById('btn-settings').classList.remove('hidden');
            phoneMockup.className = 'live-mode bg-black overflow-hidden flex flex-col';
        }
        
        function clearMap() { STATE.points = []; drawMap(); checkReadyState(); }
        function updateMode() { STATE.mode = document.getElementById('app-mode').value; }
        function updatePerson() { STATE.person = document.getElementById('person-select').value; drawMap(); }
    </script>
</body>
</html>
