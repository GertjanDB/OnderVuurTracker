<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#09090b">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SafeTrace Pro - Precision Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --tracker-color: #ef4444;
            --bg-color: #09090b;
            --panel-bg: #18181b;
            --text-color: #ffffff;
            --border-color: #27272a;
            --dot-size: 24px;
            --pointer-active: #ef4444; /* Dynamisch via JS */
            --pointer-dimmed: rgba(239, 68, 68, 0.3); /* Dynamisch via JS */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            margin: 0;
            touch-action: none;
        }

        /* Viewport & Map */
        #viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000;
            z-index: 10;
            touch-action: none;
        }

        #map-wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            backface-visibility: hidden;
        }

        #map-img {
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transition: filter 0.5s;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 2;
        }

        /* Richtkruis in het midden */
        #center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            z-index: 50;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #center-crosshair::before, #center-crosshair::after {
            content: '';
            position: absolute;
            background: var(--pointer-dimmed);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        #center-crosshair::before { width: 3px; height: 100%; }
        #center-crosshair::after { width: 100%; height: 3px; }

        #center-crosshair.active::before, #center-crosshair.active::after {
            background: var(--pointer-active);
            box-shadow: 0 0 8px var(--pointer-active);
        }

        /* Tracker Dot */
        .tracker-base {
            background: var(--tracker-color);
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--tracker-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }
        #tracker-dot {
            position: absolute;
            transform-origin: center;
            transform: translate(-50%, -50%);
            width: var(--dot-size);
            height: var(--dot-size);
            z-index: 10;
            display: none;
        }
        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--tracker-color);
            border-radius: 50%;
            opacity: 0.5;
            z-index: 1;
            animation: pulse-animation 2s infinite ease-out;
        }
        @keyframes pulse-animation {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        /* Dest Marker */
        #dest-marker {
            position: absolute;
            transform: translate(-50%, -100%);
            z-index: 5;
            display: none;
            pointer-events: none;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }
        .teardrop {
            width: 36px;
            height: 36px;
            background-color: var(--tracker-color);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
        }
        .teardrop-inner {
            transform: rotate(45deg);
            width: 26px;
            height: 26px;
            background: #18181b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid white;
            font-size: 14px;
        }

        .hidden-ui { display: none !important; }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--text-color); margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; }
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body>

    <!-- Header -->
    <div id="main-header" class="p-3 px-4 bg-zinc-950 flex justify-between items-center border-b border-zinc-800 z-[200] relative pt-[env(safe-area-inset-top, 12px)]">
        <div class="flex-grow">
            <h1 class="text-base font-black italic tracking-tighter text-zinc-400 uppercase flex items-center gap-2">
                <span id="live-dot" class="w-2 h-2 bg-red-500 rounded-full animate-pulse hidden"></span>
                TRACKER<span class="text-blue-500 underline">PRO</span>
            </h1>
            <p id="status-text" class="text-[9px] text-zinc-500 font-mono uppercase tracking-widest leading-none mt-0.5">Configuratie Modus</p>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-content" class="flex-grow flex flex-col overflow-hidden">
        
        <!-- TOP: Content Area -->
        <div id="preview-area" class="flex-grow relative bg-black overflow-hidden transition-all duration-300 min-h-0">
            
            <!-- ====== PROP UI OVERLAYS ====== -->
            
            <!-- Prop: Top Bar -->
            <div id="prop-top-bar" class="absolute top-0 left-0 right-0 p-3 pt-[calc(12px+env(safe-area-inset-top,0px))] flex items-center gap-2.5 z-[180] hidden-ui bg-gradient-to-b from-black/80 to-transparent">
                <h1 class="text-[14px] font-black italic tracking-tighter text-white mr-1 drop-shadow-md">TRACKER<span class="text-blue-500">PRO</span></h1>
                
                <div class="flex-grow bg-zinc-900/70 backdrop-blur-md border border-white/10 rounded-full flex items-center px-3 py-1.5 shadow-inner">
                    <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span class="text-[10px] text-zinc-400 ml-2 uppercase font-bold tracking-widest text-ellipsis overflow-hidden whitespace-nowrap">Zoeken...</span>
                </div>

                <button class="w-8 h-8 rounded-full bg-zinc-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 shadow-lg flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>

                <button onclick="resetToConfig()" class="w-8 h-8 rounded-full bg-zinc-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 shadow-lg flex-shrink-0">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                </button>
            </div>

            <!-- Prop: Side Actieknoppen -->
            <div id="prop-side-buttons" class="absolute right-3 top-[100px] flex flex-col gap-2.5 z-[180] hidden-ui">
                <button class="w-8 h-8 rounded-full bg-zinc-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 shadow-lg shadow-black/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                </button>
                <button class="w-8 h-8 rounded-full bg-zinc-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 shadow-lg shadow-black/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button class="w-8 h-8 rounded-full bg-red-600/90 backdrop-blur-md border border-red-400 flex items-center justify-center text-white font-black text-[9px] active:scale-95 shadow-lg shadow-red-900/50">SOS</button>
            </div>

            <!-- Shield Standby Center Overlay -->
            <div id="shield-standby-center" class="absolute inset-0 z-[150] flex flex-col items-center justify-center bg-zinc-950 hidden-ui">
                <div class="w-20 h-20 bg-zinc-900 border border-zinc-800 rounded-full flex items-center justify-center mb-6 shadow-xl">
                    <svg class="w-10 h-10 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h2 class="text-lg font-black uppercase mb-2 text-white tracking-wide">Locatie Delen Uit</h2>
                <p class="text-zinc-500 mb-10 text-[10px] max-w-[220px] text-center leading-relaxed">Je locatie wordt momenteel niet gedeeld. Tik op de knop om te starten.</p>
                <button onclick="activateShieldLive()" class="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-xl font-black uppercase tracking-widest text-[10px] text-white shadow-xl shadow-blue-900/40 transition-all active:scale-95 border border-blue-400/30">
                    LOCATIE DELEN
                </button>
            </div>

            <!-- Richtkruis -->
            <div id="center-crosshair"></div>

            <!-- Zoom Controls -->
            <div id="zoom-ctrls" class="absolute top-3 right-3 z-[100] flex flex-col gap-1.5">
                <button onclick="changeZoom(0.3)" class="w-8 h-8 bg-zinc-900/80 backdrop-blur text-white rounded-full font-black text-lg border border-zinc-700 shadow-lg active:scale-95 transition-transform flex items-center justify-center pb-0.5">+</button>
                <button onclick="changeZoom(-0.3)" class="w-8 h-8 bg-zinc-900/80 backdrop-blur text-white rounded-full font-black text-lg border border-zinc-700 shadow-lg active:scale-95 transition-transform flex items-center justify-center pb-0.5">-</button>
            </div>

            <!-- Viewport (De Kaart) -->
            <div id="viewport">
                <div id="map-wrapper">
                    <img id="map-img" alt="Kaart">
                    <canvas id="route-canvas"></canvas>
                    <div id="dest-marker"><div class="teardrop"><div class="teardrop-inner" id="dest-icon-container"></div></div></div>
                    <div id="tracker-dot">
                        <div class="tracker-base"><div class="pulse"></div></div>
                    </div>
                </div>
            </div>

            <!-- Live Prop Overlay: WATCHER MODE -->
            <div id="prop-bottom-watcher" class="absolute bottom-0 left-0 right-0 p-3 z-[170] hidden-ui bg-gradient-to-t from-black/90 to-transparent pt-12 pb-[max(env(safe-area-inset-bottom,16px),16px)]">
                <div class="bg-black/60 backdrop-blur-md border border-white/10 rounded-2xl p-3 shadow-2xl flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full border-[2px] border-[var(--tracker-color)] overflow-hidden bg-zinc-800 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-zinc-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="flex-grow">
                        <h3 id="watcher-name" class="text-white font-black text-[11px] leading-tight capitalize tracking-wide">Maaike</h3>
                        <p id="watcher-status" class="text-zinc-300 text-[9px] font-medium flex items-center mt-0.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse mr-1.5"></span>Thuis</p>
                        <p class="text-zinc-500 text-[8px] font-mono mt-0.5 uppercase tracking-widest">Update: <span id="watcher-time">09:10</span></p>
                    </div>
                    <div class="text-right flex flex-col items-end justify-center gap-1">
                         <div class="w-7 h-7 rounded-full bg-blue-600/20 text-blue-500 flex items-center justify-center border border-blue-500/30">
                             <svg class="w-3.5 h-3.5" fill="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                         </div>
                         <span class="text-[8px] text-zinc-400 font-bold uppercase tracking-widest">Live</span>
                    </div>
                </div>
            </div>

            <!-- Live Prop Overlay: SHIELD MODE -->
            <div id="prop-bottom-shield" class="absolute bottom-0 left-0 right-0 p-3 z-[170] hidden-ui bg-gradient-to-t from-black/90 to-transparent pt-12 pb-[max(env(safe-area-inset-bottom,16px),16px)]">
                <div class="bg-black/60 backdrop-blur-md border border-white/10 rounded-2xl p-3 flex justify-between items-center shadow-2xl">
                    <div class="flex items-center gap-2.5">
                        <div id="shield-icon-circle" class="w-8 h-8 rounded-full border-2 border-zinc-500 text-zinc-500 flex items-center justify-center bg-zinc-900">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6z"/></svg>
                        </div>
                        <div>
                            <p id="shield-status-title" class="text-[11px] text-zinc-400 font-black uppercase tracking-widest leading-tight">Locatie Delen Uit</p>
                            <p class="text-[9px] text-zinc-500 font-mono mt-0.5 tracking-wider">Mijn Apparaat</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <p id="shield-uplink-status" class="text-[8px] text-zinc-500 font-bold uppercase tracking-widest">Offline</p>
                        </div>
                        <button id="shield-stop-btn" onclick="deactivateShieldLive()" class="hidden-ui py-2 px-3 bg-red-600/20 text-red-500 border border-red-500/50 rounded-lg text-[8px] font-black uppercase active:scale-95 transition-transform flex items-center justify-center">
                            STOP
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- BOTTOM: Config Panel -->
        <div id="config-container" class="flex-none bg-[var(--panel-bg)] border-t border-zinc-800 p-3 flex flex-col gap-2.5 pb-[calc(12px+env(safe-area-inset-bottom,0px))]">
            
            <div class="text-[9px] text-zinc-500 text-right font-mono tracking-wider mb-1">v1.0.6</div>

            <button onclick="toggleFullscreen()" class="w-full py-2 bg-zinc-900 text-zinc-400 rounded-lg text-[9px] font-black uppercase border border-zinc-800 active:bg-zinc-800 transition-colors flex items-center justify-center gap-2">
                ⛶ Schakel Fullscreen
            </button>

            <button onclick="document.getElementById('map-upload').click()" class="w-full py-2 bg-zinc-800 text-white rounded-lg font-black uppercase tracking-widest text-[9px] border border-zinc-700 active:bg-zinc-700 transition-all flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Kaart Uploaden / Wijzigen
            </button>

            <div class="grid grid-cols-2 gap-2">
                <select id="app-mode" onchange="updateMode()" class="w-full bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-2 pr-2 rounded-lg outline-none">
                    <option value="watcher">👁️ Iemand Volgen</option>
                    <option value="shield">🛡️ Mijn Locatie</option>
                </select>
                <select id="person-select" onchange="updatePerson()" class="w-full bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-2 pr-2 rounded-lg outline-none">
                    <option value="maaike">🔴 Maaike</option>
                    <option value="orlando">🔵 Orlando</option>
                </select>
            </div>

            <div id="watcher-extra-config" class="grid grid-cols-2 gap-2">
                <input type="text" id="status-input" value="Thuis" oninput="STATE.statusText = this.value" class="bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-2 rounded-lg outline-none" placeholder="Status">
                <input type="time" id="time-input" value="09:10" onchange="STATE.updateTime = this.value" class="bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-2 rounded-lg outline-none">
            </div>

            <div class="flex gap-2 items-center">
                <div class="relative flex-grow">
                    <select id="tool-select" onchange="setTool(this.value)" class="w-full bg-zinc-900 border border-zinc-800 text-white text-[10px] font-bold p-2 rounded-lg outline-none">
                        <option value="pan">🖐️ Kaart Verslepen</option>
                        <option id="opt-route" value="route">🗺️ Teken Volgroute</option>
                    </select>
                </div>
                <!-- Checkbox punt vastzetten -->
                <div class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 p-2 rounded-lg">
                    <input type="checkbox" id="point-toggle" disabled onchange="togglePoint(this.checked)" class="w-3.5 h-3.5 accent-blue-600 rounded cursor-not-allowed">
                    <span id="point-label" class="text-[8px] font-black uppercase text-zinc-600">Vast punt</span>
                </div>
                <button onclick="clearMap()" class="px-3 py-2 bg-zinc-900 border border-zinc-800 text-red-500 rounded-lg text-[8px] font-black uppercase tracking-widest active:bg-zinc-800 transition-colors">Wis</button>
            </div>

            <div id="dest-config" class="grid grid-cols-3 gap-2">
                <button id="btn-dest-none" onclick="setDest('none')" class="py-1.5 bg-zinc-800 border-2 border-white rounded-lg text-[8px] font-bold text-white uppercase text-center">Geen Icoon</button>
                <button id="btn-dest-home" onclick="setDest('home')" class="py-1.5 bg-zinc-900 border-2 border-transparent rounded-lg text-[8px] font-bold text-zinc-400 uppercase text-center">🏠 Home</button>
                <button onclick="document.getElementById('dest-upload').click()" class="py-1.5 bg-zinc-900 border-2 border-transparent rounded-lg text-[8px] font-bold text-zinc-400 uppercase text-center">📸 Foto</button>
            </div>

            <div class="bg-zinc-900/50 p-2.5 rounded-xl border border-zinc-800 flex flex-col gap-2">
                <div class="flex gap-3">
                    <div class="flex-1 space-y-1">
                        <div class="text-[8px] text-zinc-400 uppercase font-black px-1">Grootte</div>
                        <input type="range" id="size-slider" min="10" max="60" value="24" oninput="updateSize(this.value)">
                    </div>
                    <div class="flex-1 space-y-1" id="speed-config">
                        <div class="text-[8px] text-zinc-400 uppercase font-black px-1">Snelheid</div>
                        <input type="range" id="speed-slider" min="10" max="200" value="50" oninput="STATE.speed = parseInt(this.value)">
                    </div>
                </div>
                <div class="flex items-center pt-1.5 border-t border-zinc-800/50">
                    <label class="flex items-center gap-2 cursor-pointer w-full">
                        <input type="checkbox" id="auto-center-toggle" onchange="STATE.autoCenter = this.checked" class="w-3.5 h-3.5 accent-blue-600 rounded">
                        <span class="text-[9px] text-zinc-400 uppercase font-black mt-0.5">Auto-Center Live</span>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="btn-preview" onclick="togglePreview()" class="py-2.5 bg-zinc-800 text-white rounded-lg font-black uppercase tracking-widest text-[8px] disabled:opacity-30" disabled>Preview Loop</button>
                <button id="btn-live" onclick="startLiveMode()" class="py-2.5 bg-blue-600 text-white rounded-lg font-black uppercase tracking-widest text-[9px] shadow-lg shadow-blue-900/30 disabled:opacity-30 active:scale-95 transition-transform" disabled>Start Live</button>
            </div>
        </div>
    </div>

    <!-- Start Overlay (Nu hidden by default) -->
    <div id="intro-screen" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-[300] bg-zinc-950 hidden-ui">
        <div class="w-16 h-16 bg-blue-500/10 border border-blue-500/20 rounded-full flex items-center justify-center mb-6 animate-pulse">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A2 2 0 013 15.382V5.618a2 2 0 011.447-1.817l7-2a2 2 0 011.106 0l7 2A2 2 0 0121 5.618v9.764a2 2 0 01-1.553 1.898L15 20V13H9v7z"></path></svg>
        </div>
        <p class="text-zinc-500 text-[10px] font-black uppercase tracking-widest mb-2">SafeTrace Pro v1.0.6</p>
        <button onclick="document.getElementById('map-upload').click()" class="bg-blue-600 hover:bg-blue-500 px-8 py-3.5 rounded-xl font-bold shadow-xl text-white text-sm">KAART LADEN</button>
    </div>

    <input type="file" id="map-upload" class="hidden" accept="image/*" onchange="handleMapUpload(event)">
    <input type="file" id="dest-upload" class="hidden" accept="image/*" onchange="handleDestUpload(event)">

    <script>
        const STATE = {
            mode: 'watcher',
            tool: 'pan',
            person: 'maaike',
            statusText: 'Thuis',
            updateTime: '09:10',
            destType: 'none',
            destImg: null,
            points: [],
            fixedPoint: null,
            showPoint: false,
            scale: 1,
            posX: 0,
            posY: 0,
            size: 24,
            speed: 50,
            autoCenter: false,
            isPlayingPreview: false,
            isLive: false,
            animProgress: 0,
            targetIndex: 1,
            lastTime: 0,
            animId: null,
            isShieldActive: false,
            pointReady: false
        };

        const COLORS = { maaike: '#ef4444', orlando: '#3b82f6' };
        let isDragging = false;
        let startX, startY;
        let initialPinchDist = null;
        let hasMovedSinceStart = false;

        const viewport = document.getElementById('viewport');
        const mapWrapper = document.getElementById('map-wrapper');
        const mapImg = document.getElementById('map-img');
        const canvas = document.getElementById('route-canvas');
        const ctx = canvas.getContext('2d');
        const trackerDot = document.getElementById('tracker-dot');
        const destMarker = document.getElementById('dest-marker');
        const configContainer = document.getElementById('config-container');
        const mainHeader = document.getElementById('main-header');
        const pointCheckbox = document.getElementById('point-toggle');
        const pointLabel = document.getElementById('point-label');
        const crosshair = document.getElementById('center-crosshair');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function handleMapUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const imgData = e.target.result;
                const tempImg = new Image();
                tempImg.onload = function() {
                    mapImg.src = imgData;
                    document.getElementById('intro-screen').classList.add('hidden-ui');
                    
                    setTimeout(() => {
                        const rect = viewport.getBoundingClientRect();
                        canvas.width = tempImg.naturalWidth;
                        canvas.height = tempImg.naturalHeight;
                        
                        const scaleW = rect.width / tempImg.naturalWidth;
                        const scaleH = rect.height / tempImg.naturalHeight;
                        STATE.scale = Math.max(scaleW, scaleH);
                        
                        STATE.posX = (rect.width - tempImg.naturalWidth * STATE.scale) / 2;
                        STATE.posY = (rect.height - tempImg.naturalHeight * STATE.scale) / 2;
                        
                        STATE.points = [];
                        STATE.fixedPoint = null;
                        STATE.showPoint = false;
                        resetPointPlacement();
                        
                        applyTransform();
                        updateThemeColors();
                        drawMap();
                        checkReadyState();
                    }, 80);
                };
                tempImg.src = imgData;
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function handleDestUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                STATE.destImg = e.target.result;
                setDest('img');
            };
            reader.readAsDataURL(file);
        }

        function resetPointPlacement() {
            STATE.pointReady = false;
            pointCheckbox.disabled = true;
            pointCheckbox.checked = false;
            pointCheckbox.classList.add('cursor-not-allowed');
            pointLabel.classList.replace('text-zinc-400', 'text-zinc-600');
            crosshair.classList.remove('active');
            STATE.fixedPoint = null;
            drawMap();
            checkReadyState();
        }

        function enablePointPlacement() {
            STATE.pointReady = true;
            pointCheckbox.disabled = false;
            pointCheckbox.classList.remove('cursor-not-allowed');
            pointLabel.classList.replace('text-zinc-600', 'text-zinc-400');
            crosshair.classList.add('active');
        }

        viewport.addEventListener('touchstart', (e) => {
            if (STATE.isPlayingPreview || STATE.isLive) return;
            if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            } else if (e.touches.length === 1) {
                startInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (STATE.isPlayingPreview || STATE.isLive) return;
            if (e.touches.length === 2 && initialPinchDist !== null) {
                if(STATE.showPoint) return;
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = (currentDist - initialPinchDist) / 150;
                changeZoom(zoomFactor);
                initialPinchDist = currentDist;
                resetPointPlacement();
            } else if (e.touches.length === 1) {
                moveInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (!hasMovedSinceStart && isDragging) enablePointPlacement();
            isDragging = false;
            initialPinchDist = null;
        });

        viewport.addEventListener('mousedown', (e) => {
            startInteraction(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            moveInteraction(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => {
            if (!hasMovedSinceStart && isDragging) enablePointPlacement();
            isDragging = false;
        });

        function startInteraction(x, y) {
            isDragging = true;
            hasMovedSinceStart = false;
            startX = x - STATE.posX;
            startY = y - STATE.posY;

            if (STATE.tool === 'pan' && !STATE.showPoint) {
                viewport.style.cursor = 'grabbing';
            } else if (STATE.tool === 'route') {
                const mapCoords = getMapCoords(x, y);
                STATE.points.push(mapCoords);
                drawMap();
                checkReadyState();
            }
        }

        function moveInteraction(x, y) {
            if (!isDragging) return;

            const dx = Math.abs(x - (startX + STATE.posX));
            const dy = Math.abs(y - (startY + STATE.posY));

            if (dx > 4 || dy > 4) {
                hasMovedSinceStart = true;
                if (STATE.pointReady || STATE.showPoint) resetPointPlacement();
            }

            if (STATE.tool === 'pan' && !STATE.showPoint) {
                STATE.posX = x - startX;
                STATE.posY = y - startY;
                applyTransform();
            }
        }

        function togglePoint(checked) {
            STATE.showPoint = checked;
            if (checked) {
                const rect = viewport.getBoundingClientRect();
                STATE.fixedPoint = {
                    x: (rect.width / 2 - STATE.posX) / STATE.scale,
                    y: (rect.height / 2 - STATE.posY) / STATE.scale
                };
                viewport.style.cursor = 'not-allowed';
            } else {
                STATE.fixedPoint = null;
                viewport.style.cursor = 'default';
            }
            drawMap();
            checkReadyState();
        }

        function getMapCoords(clientX, clientY) {
            const rect = mapWrapper.getBoundingClientRect();
            return { x: (clientX - rect.left) / STATE.scale, y: (clientY - rect.top) / STATE.scale };
        }

        function applyTransform() {
            mapWrapper.style.transform = `translate3d(${STATE.posX}px, ${STATE.posY}px, 0) scale(${STATE.scale})`;
        }

        function changeZoom(delta) {
            if(STATE.showPoint) return;
            const oldScale = STATE.scale;
            STATE.scale = Math.max(0.02, Math.min(10, STATE.scale + delta));
            const ratio = STATE.scale / oldScale;
            const rect = viewport.getBoundingClientRect();

            STATE.posX = (rect.width / 2) - ((rect.width / 2) - STATE.posX) * ratio;
            STATE.posY = (rect.height / 2) - ((rect.height / 2) - STATE.posY) * ratio;

            resetPointPlacement();
            applyTransform();
            drawMap();
        }

        function setTool(tool) {
            STATE.tool = tool;
            document.getElementById('tool-select').value = tool;
            viewport.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
        }

        function updateMode() {
            const isShield = document.getElementById('app-mode').value === 'shield';
            STATE.mode = document.getElementById('app-mode').value;

            document.getElementById('dest-config').style.display = isShield ? 'none' : 'grid';
            document.getElementById('speed-config').style.visibility = isShield ? 'hidden' : 'visible';
            document.getElementById('watcher-extra-config').style.display = isShield ? 'none' : 'grid';
            document.getElementById('opt-route').style.display = isShield ? 'none' : 'block';

            if (isShield && STATE.tool === 'route') setTool('pan');
            updateThemeColors();
            drawMap();
        }

        function updatePerson() {
            STATE.person = document.getElementById('person-select').value;
            updateThemeColors();
            drawMap();
        }

        function updateThemeColors() {
            const color = COLORS[STATE.person];
            document.documentElement.style.setProperty('--tracker-color', color);
            document.documentElement.style.setProperty('--pointer-active', color);
            document.documentElement.style.setProperty('--pointer-dimmed', color + '4d'); // 30% alpha
            document.getElementById('btn-live').style.backgroundColor = color;
        }

        function updateSize(val) {
            STATE.size = val;
            document.documentElement.style.setProperty('--dot-size', `${val}px`);
        }

        function setDest(type) {
            STATE.destType = type;
            ['none', 'home'].forEach(t => {
                const btn = document.getElementById(`btn-dest-${t}`);
                if (btn) {
                    btn.classList.toggle('border-white', t === type);
                    btn.classList.toggle('text-white', t === type);
                    btn.classList.toggle('border-transparent', t !== type);
                }
            });
            drawMap();
        }

        function clearMap() {
            STATE.points = [];
            resetPointPlacement();
            drawMap();
        }

        function checkReadyState() {
            const ok = STATE.fixedPoint !== null || STATE.points.length > 0;
            document.getElementById('btn-preview').disabled = !ok;
            document.getElementById('btn-live').disabled = !ok;
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const activePoint = STATE.fixedPoint || (STATE.points.length > 0 ? STATE.points[STATE.points.length - 1] : null);
            const shouldShowDot = activePoint && (!STATE.isLive || STATE.mode !== 'shield' || STATE.isShieldActive);

            if (STATE.points.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = COLORS[STATE.person];
                ctx.lineWidth = 6 / STATE.scale;
                if (STATE.points.length > 1) ctx.setLineDash([15 / STATE.scale, 10 / STATE.scale]);
                ctx.moveTo(STATE.points[0].x, STATE.points[0].y);
                STATE.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            }

            if (shouldShowDot) {
                trackerDot.style.display = 'block';
                trackerDot.style.left = activePoint.x + 'px';
                trackerDot.style.top = activePoint.y + 'px';
            } else { trackerDot.style.display = 'none'; }

            if (STATE.mode !== 'shield' && STATE.destType !== 'none' && activePoint) {
                destMarker.style.display = 'block';
                destMarker.style.left = activePoint.x + 'px';
                destMarker.style.top = activePoint.y + 'px';
                if (STATE.destType === 'home') {
                    document.getElementById('dest-icon-container').innerHTML = '🏠';
                } else if (STATE.destImg) {
                    document.getElementById('dest-icon-container').innerHTML = `<img src="${STATE.destImg}">`;
                }
            } else {
                destMarker.style.display = 'none';
            }
        }

        function togglePreview() {
            STATE.isPlayingPreview = true;
            configContainer.classList.add('hidden-ui');
            document.getElementById('center-crosshair').classList.add('hidden-ui');
            enablePropOverlays();
            if (STATE.mode === 'shield') {
                document.getElementById('shield-standby-center').classList.remove('hidden-ui');
                document.getElementById('viewport').classList.add('hidden-ui');
                document.getElementById('prop-bottom-shield').classList.remove('hidden-ui');
                updateShieldBottom(false);
            } else { startAnimation(); }
        }

        function startLiveMode() {
            STATE.isLive = true;
            stopAnimation();
            mainHeader.classList.add('hidden-ui');
            configContainer.classList.add('hidden-ui');
            document.getElementById('center-crosshair').classList.add('hidden-ui');
            document.getElementById('zoom-ctrls').classList.add('hidden-ui');
            enablePropOverlays();
            if (STATE.mode === 'shield') {
                document.getElementById('shield-standby-center').classList.remove('hidden-ui');
                document.getElementById('viewport').classList.add('hidden-ui');
                document.getElementById('prop-bottom-shield').classList.remove('hidden-ui');
                updateShieldBottom(false);
            } else {
                mapImg.style.filter = 'saturate(1.2)';
                startAnimation();
            }
        }

        function activateShieldLive() {
            STATE.isShieldActive = true;
            document.getElementById('shield-standby-center').classList.add('hidden-ui');
            document.getElementById('viewport').classList.remove('hidden-ui');
            updateShieldBottom(true);
            
            // Toon tracker direct
            drawMap();
            
            mapImg.style.filter = 'grayscale(0.4) contrast(1.2)';
            startAnimation();
        }

        function deactivateShieldLive() {
            STATE.isShieldActive = false;
            document.getElementById('shield-standby-center').classList.remove('hidden-ui');
            document.getElementById('viewport').classList.add('hidden-ui');
            updateShieldBottom(false);
            stopAnimation();
            drawMap();
        }

        function updateShieldBottom(active) {
            const title = document.getElementById('shield-status-title');
            const uplink = document.getElementById('shield-uplink-status');
            const stopBtn = document.getElementById('shield-stop-btn');
            const iconCircle = document.getElementById('shield-icon-circle');

            if (active) {
                title.innerText = "Locatie Delen Actief";
                title.className = "text-[11px] text-white font-black uppercase tracking-widest leading-tight";
                uplink.innerText = "Uplink";
                uplink.className = "text-[8px] text-green-500 font-bold uppercase animate-pulse tracking-widest";
                stopBtn.classList.remove('hidden-ui');
                iconCircle.style.color = COLORS[STATE.person];
                iconCircle.style.borderColor = COLORS[STATE.person];
            } else {
                title.innerText = "Locatie Delen Uit";
                title.className = "text-[11px] text-zinc-400 font-black uppercase tracking-widest leading-tight";
                uplink.innerText = "Offline";
                uplink.className = "text-[8px] text-zinc-500 font-bold uppercase tracking-widest";
                stopBtn.classList.add('hidden-ui');
                iconCircle.style.color = "#71717a";
                iconCircle.style.borderColor = "#71717a";
            }
        }

        function enablePropOverlays() {
            document.getElementById('prop-top-bar').classList.remove('hidden-ui');
            document.getElementById('prop-side-buttons').classList.remove('hidden-ui');
            if (STATE.mode === 'shield') {
                document.getElementById('prop-bottom-shield').classList.remove('hidden-ui');
                document.getElementById('prop-bottom-watcher').classList.add('hidden-ui');
            } else {
                document.getElementById('prop-bottom-watcher').classList.remove('hidden-ui');
                document.getElementById('prop-bottom-shield').classList.add('hidden-ui');
                document.getElementById('watcher-name').innerText = STATE.person.charAt(0).toUpperCase() + STATE.person.slice(1);
                document.getElementById('watcher-status').innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse mr-1.5"></span>${STATE.statusText}`;
                document.getElementById('watcher-time').innerText = STATE.updateTime;
            }
        }

        function resetToConfig() {
            STATE.isLive = false; STATE.isPlayingPreview = false; STATE.isShieldActive = false; stopAnimation();
            mainHeader.classList.remove('hidden-ui'); configContainer.classList.remove('hidden-ui');
            document.getElementById('prop-top-bar').classList.add('hidden-ui');
            document.getElementById('prop-side-buttons').classList.add('hidden-ui');
            document.getElementById('prop-bottom-watcher').classList.add('hidden-ui');
            document.getElementById('prop-bottom-shield').classList.add('hidden-ui');
            document.getElementById('shield-standby-center').classList.add('hidden-ui');
            document.getElementById('viewport').classList.remove('hidden-ui');
            document.getElementById('zoom-ctrls').classList.remove('hidden-ui');
            document.getElementById('center-crosshair').classList.remove('hidden-ui');
            mapImg.style.filter = 'none';
            drawMap();
        }

        function startAnimation() {
            STATE.animProgress = 0; STATE.targetIndex = 1; STATE.lastTime = performance.now();
            const p = STATE.fixedPoint || (STATE.points.length > 0 ? STATE.points[0] : null);
            if (STATE.mode === 'shield' || STATE.points.length < 2) {
                if (p) { updateTrackerLive(p.x, p.y); }
            } else { STATE.animId = requestAnimationFrame(animLoop); }
        }

        function stopAnimation() {
            if (STATE.animId) cancelAnimationFrame(STATE.animId);
            drawMap();
        }

        function animLoop(timestamp) {
            if (!STATE.isPlayingPreview && !STATE.isLive) return;
            const delta = (timestamp - STATE.lastTime) / 1000; STATE.lastTime = timestamp;
            const p1 = STATE.points[STATE.targetIndex - 1], p2 = STATE.points[STATE.targetIndex];
            if (!p1 || !p2) return;
            const dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            if (dist > 0) STATE.animProgress += (STATE.speed * delta) / dist; else STATE.animProgress = 1;
            if (STATE.animProgress >= 1) { STATE.animProgress = 0; STATE.targetIndex++; if (STATE.targetIndex >= STATE.points.length) STATE.targetIndex = 1; }
            const curX = p1.x + (p2.x - p1.x) * STATE.animProgress, curY = p1.y + (p2.y - p1.y) * STATE.animProgress;
            updateTrackerLive(curX, curY); STATE.animId = requestAnimationFrame(animLoop);
        }

        function updateTrackerLive(x, y) {
            trackerDot.style.left = `${x}px`; trackerDot.style.top = `${y}px`;
            if (STATE.autoCenter && (STATE.isPlayingPreview || STATE.isLive)) {
                const rect = viewport.getBoundingClientRect();
                STATE.posX = (rect.width / 2) - (x * STATE.scale); STATE.posY = (rect.height / 2) - (y * STATE.scale);
                applyTransform();
            }
        }

        const resizeObs = new ResizeObserver(entries => {
            for(let entry of entries) {
                const nw = entry.contentRect.width, nh = entry.contentRect.height;
                if (lastViewportW > 0 && lastViewportH > 0 && nw > 0) {
                    if (!(STATE.autoCenter && (STATE.isPlayingPreview || STATE.isLive) && STATE.points.length > 1)) {
                        const cx = (lastViewportW / 2 - STATE.posX) / STATE.scale, cy = (lastViewportH / 2 - STATE.posY) / STATE.scale;
                        STATE.posX = (nw / 2) - (cx * STATE.scale); STATE.posY = (nh / 2) - (cy * STATE.scale);
                        applyTransform();
                    }
                }
                lastViewportW = nw; lastViewportH = nh;
            }
        });
        let lastViewportW = 0, lastViewportH = 0; resizeObs.observe(viewport);
        
        // Initial setup
        updateThemeColors();
    </script>
</body>
</html>
